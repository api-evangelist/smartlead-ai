notes:
- >-
  The published spec declares no $ref between component schemas — every schema is self-contained
  and every relationship above is evidenced by a named id field or a URL path, not by a schema
  reference. That is a real modelling gap: an agent cannot traverse the object graph from the spec
  alone.
- Smart Delivery (28 operations) and Smart Senders (5) publish no component schemas at all; their
  request and response bodies are untyped objects in the spec.
