description: >-
  Entity-relationship graph for the SmartLead API, derived from the 28 component schemas and the
  path templates of the 98 published operations. Relationships are inferred from id-reference
  fields (user_id, client_id, campaign_id, email_campaign_id) and from path nesting — the spec
  declares no $ref between schemas, so every edge below comes from a named id field or a URL path,
  and each edge records which.
entities:
- name: User
  schema: User
  id: id
  description: The SmartLead account the API key belongs to; resolved by getUserByApiKey.
  operations: [getUserByApiKey]
- name: Client
  id: client_id
  description: >-
    An agency's white-labeled client workspace. Referenced by Campaign.client_id and User.client_id
    and filtered on via client_id / client_ids query parameters; no standalone Client schema is
    published even though client operations exist.
  schema: null
- name: Campaign
  schema: Campaign
  id: id
  description: An email campaign — the central object; sequences, leads, mailboxes and webhooks all hang off it.
  operations: [getAllCampaigns, getCampaignById, createCampaign, deleteCampaign, updateCampaignStatus,
    updateCampaignSettings, updateCampaignSchedule]
- name: CampaignSettings
  schema: CampaignSettings
  description: Sending configuration for one campaign (value object, no id).
  operations: [updateCampaignSettings]
- name: CampaignSchedule
  schema: CampaignSchedule
  description: Sending window/timezone configuration for one campaign (value object, no id).
  operations: [updateCampaignSchedule]
- name: EmailSequence
  schema: EmailSequence
  id: id
  description: An ordered email step within a campaign, including A/B variants and delays.
  operations: [getCampaignSequences, updateCampaignSequences]
- name: Lead
  schema: Lead
  id: id
  description: A prospect. Global identity is the email address; membership in a campaign is a separate association.
  operations: [getCampaignLeads, addLeadsToCampaign, updateLead, deleteLeadFromCampaign, pauseLead,
    resumeLead, unsubscribeLeadFromCampaign, getLeadByEmail, getLeadCampaigns, unsubscribeLeadGlobally]
- name: LeadCategory
  schema: LeadCategory
  id: id
  description: Reply-classification bucket (interested, not interested, meeting booked, …).
  operations: [getLeadCategories, updateLeadCategory]
- name: LeadList
  schema: LeadList
  id: id
  description: A named list of leads owned by a user, importable into campaigns.
  operations: [createLeadList, getAllLeadLists, getLeadListById, updateLeadList, deleteLeadList,
    importLeadsToList, assignTagsToLeadLists]
- name: EmailAccount
  schema: EmailAccount
  id: id
  description: A sender mailbox (SMTP, Gmail/OAuth, Outlook) with sending limits and warmup state.
  operations: [getAllEmailAccounts, getEmailAccountById, addSmtpEmailAccount, addOauthEmailAccount,
    updateEmailAccount, deleteEmailAccount, suspendEmailAccount, unsuspendEmailAccount]
- name: WarmupSettings
  schema: WarmupSettings
  description: Warmup ramp configuration attached to one email account (value object).
  operations: [updateWarmupSettings]
- name: WarmupStats
  schema: WarmupStats
  description: Reputation and warmup performance readings for one email account.
  operations: [getWarmupStats]
- name: Webhook
  schema: Webhook
  id: id
  description: An event subscription scoped to user, client or campaign.
  operations: [createWebhook, getWebhookDetails, updateWebhook, deleteWebhook]
- name: CampaignStatistics
  schema: CampaignStatistics
  description: Per-campaign performance rollup (read model).
  operations: [getCampaignStatistics]
- name: CampaignAnalytics
  schema: CampaignAnalytics
  description: Per-campaign analytics keyed on campaign_id (read model).
  operations: [getCampaignAnalytics]
- name: CampaignPerformance
  schema: CampaignPerformance
  description: Cross-campaign performance row keyed on campaign_id (read model).
  operations: [getCampaignWisePerformance]
- name: OverallStats
  schema: OverallStats
  description: Account-level aggregate (read model).
  operations: [getOverallStats]
- name: DailyStats
  schema: DailyStats
  description: Day-bucketed aggregate (read model).
  operations: [getDayWiseStats, getDayWisePositiveReplyStats]
- name: InboxMessage
  schema: InboxResponse
  description: A message in the unified master inbox; filtered by InboxFilter.
