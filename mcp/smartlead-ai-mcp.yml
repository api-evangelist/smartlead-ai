description: 'SmartLead operates a remote MCP server on its documentation/API host. `tools/list` answered
  anonymously over Streamable HTTP (SSE), so the tool set below is the server''s real, live manifest with
  its real inputSchemas — captured verbatim in smartlead-ai-tools-list.json. It is a DOCUMENTATION server
  (Mintlify-style): the tools search and read the SmartLead API docs and OpenAPI, they do not call the
  SmartLead REST API. An agent can use it to learn the API; it cannot use it to create a campaign or import
  a lead.'
