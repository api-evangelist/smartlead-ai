notes:
- >-
  The gap is the finding, not a defect in this crosswalk. SmartLead ships an agent-readable
  contract (OpenAPI 3.1.1, an agent card, a published Agent Skill) and a docs MCP server, but no
  first-party MCP server that executes campaign, lead, mailbox or webhook operations. Agents that
  need to act call the REST API directly, or run one of the third-party community MCP servers.
- >-
  A candidate execution-tool set for a first-party server is exactly the rest_only[] list above;
  each entry already carries a real operationId whose parameters and requestBody in
  openapi/smartlead-ai-openapi.yml are the tool's real inputSchema.
