description: >-
  SmartLead's error contract. Errors are a vendor JSON envelope, not RFC 9457 problem+json — no
  operation in the published OpenAPI declares application/problem+json. The status table below is
  SmartLead's own; the per-status response counts are counted from the 98-operation spec.
envelope:
  shape: |
    {
      "error": {
        "code": "VALIDATION_ERROR",
        "message": "email field is required for all leads in lead_list",
        "details": {
          "field": "lead_list[2].email",
          "constraint": "required"
        }
      }
    }
  fields:
  - name: error.code
    description: Machine-readable error code (e.g. VALIDATION_ERROR, RATE_LIMIT_EXCEEDED)
  - name: error.message
    description: Human-readable description
  - name: error.details
    description: Object with field-level context (field path, violated constraint)
  schema: openapi/smartlead-ai-openapi.yml#/components/schemas/ErrorResponse
  schema_note: >-
    The spec's ErrorResponse schema is flatter than the documented envelope — it declares `error`
    (string), `code` (string) and `details` (object) at the top level, where the docs show a
    nested `error` object. Consumers should tolerate both shapes.
