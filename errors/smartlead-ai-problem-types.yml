  action: The resource (campaign, lead, mailbox) does not exist or belongs to another account.
  in_spec: 35
- status: 409
  title: Conflict
  action: >-
    Duplicate resource — the lead or campaign already exists. On lead import this is expected
    behaviour, not a failure; inspect the skipped_leads array in the import response.
  in_spec: 0
- status: 422
  title: Unprocessable Entity
  action: Validation failed — check field values.
  in_spec: 36
- status: 429
  title: Too Many Requests
  action: >-
    Rate limited. Honor Retry-After, then exponential backoff with jitter. See
    rate-limits/smartlead-ai-rate-limits.yml.
  code: RATE_LIMIT_EXCEEDED
  in_spec: 1
- status: 500
  title: Internal Server Error
  action: >-
    Retry with exponential backoff. If it persists, SmartLead's guide directs users to its status
    page and support.
  in_spec: 97
- status: 503
  title: Service Unavailable
  action: Temporary outage — retry after a short delay.
  in_spec: 0
retry_policy:
  retryable_statuses: [429, 500, 502, 503]
  non_retryable: [400, 401, 403, 404, 409, 422]
  strategy: exponential backoff with jitter, Retry-After honored when present
  documented_default_retries: 3
common_errors:
- status: 401
  cause: api_key parameter missing, expired or incorrect.
  remediation: Verify or regenerate the key in SmartLead Settings -> API Keys; pass as ?api_key=.
- status: 400
  cause: A lead object in lead_list has no email field.
  remediation: Validate every lead has a well-formed email before import.
- status: 400
  cause: Lead list exceeds the maximum size.
  remediation: Batch imports into groups of 400 leads or fewer.
- status: 404
  cause: Campaign ID does not exist or belongs to a different account.
  remediation: List campaigns first and confirm the ID.
- status: 409
  cause: A lead with the same email is already in the campaign.
  remediation: Expected duplicate suppression — read skipped_leads in the import response.
