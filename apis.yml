aid: smartlead-ai
url: https://raw.githubusercontent.com/api-evangelist/smartlead-ai/refs/heads/main/apis.yml
name: Smartlead
kind: company
description: >-
  Smartlead is cold email infrastructure for outbound sales and lead
  generation, focused on inbox deliverability through unlimited mailbox
  rotation, automated warmup, and a unified master inbox. Smartlead publishes an
  OpenAPI 3.1.1 contract with 98 operations at server.smartlead.ai/api/v1
  covering campaigns, sequences, leads and lead lists, sender mailboxes and
  warmup, the master inbox, webhooks, analytics, Smart Delivery placement
  testing, Smart Senders and agency client management, authenticated with an API
  key passed as a query parameter. It also ships an unusually forward agent
  surface for its size — an A2A agent card, a published Agent Skill, a remote
  documentation MCP server, llms.txt, and a first-party CLI — alongside a
  13-event signed webhook catalog.
