description: >-
  SmartLead's published subscription tiers, read from its pricing page. Pricing is per workspace
  per month and is metered on contacts stored, emails sent and verified prospect emails — NOT on
  API calls. "API & Webhooks" appears as a plan feature row; API rate limits are tiered separately
  (see rate-limits/smartlead-ai-rate-limits.yml). This file replaces an earlier scaffold whose
  tiers and quotas were placeholder defaults.
