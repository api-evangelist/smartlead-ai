notes:
- >-
  API access is not sold as a separate product or metered per call. "API & Webhooks" is a listed
  feature row on the plan comparison; the served pricing HTML does not resolve which tiers carry a
  check mark, so per-tier API entitlement is not recorded here rather than guessed.
- >-
  API rate limits are published against Standard / Pro / Enterprise tiers in the rate-limits guide,
  a different tier vocabulary from these four subscription plans. SmartLead does not publish a
  mapping between the two.
- Enterprise pricing is a "Book a Demo" motion with no published price.
